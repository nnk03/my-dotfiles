# set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# set -g prefix C-a
# unbind C-b
# bind-key C-a send-prefix

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Start windows and panes index at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Prefix + lscm --> list available commands and their options

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind R
bind R source-file ~/.tmux.conf\; display "Reloaded!"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection 
# start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection 
# copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

##### Display Popups ##### 

# The below key-bindings have been taken from https://tmuxai.dev/tmux-popup/
# https://tmuxai.dev/tmux-config/ - tmux config generator
# https://tmuxai.dev/tmux-getting-started/ - tmux reference
# Open shell in a popup with Ctrl+b T
bind-key T display-popup -d '#{pane_current_path}' -E

# Open a large popup with Ctrl+b P
bind-key P display-popup -d '#{pane_current_path}' -w 80% -h 80% -E

# bind C-y display-popup \
#   -d "#{pane_current_path}" \
#   -w 80% \
#   -h 80% \
#   -E "lazygit"
# bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind-key G display-popup -E '
   current=$(tmux display-message -p "#{session_name}")
   {
      echo "$current"
      tmux list-sessions -F "#{session_name}" \
         | grep -vx "$current"
   } \
      | fzf --reverse \
      | xargs -r tmux switch-client -t
   '
bind-key p display-popup -E "python" # overrides default behaviour of <prefix>+p i.e move to previous pane
